name: 'MigrationPilot'
description: 'Analyze PostgreSQL migrations for safety before deployment'
author: 'Mickel Samuel'
branding:
  icon: 'shield'
  color: 'blue'

inputs:
  migration-path:
    description: 'Path to migration SQL files'
    required: true
  github-token:
    description: 'GitHub token for PR comments'
    default: ${{ github.token }}
  database-url:
    description: 'PostgreSQL connection string. Enables the rules that read the live catalog (table size, write traffic, replication).'
    required: false
  license-key:
    description: 'Accepted for backward compatibility; no longer affects analysis. Every rule runs without one.'
    required: false
  pg-version:
    description: 'Target PostgreSQL version'
    default: '17'
  fail-on:
    description: 'Fail CI on: critical, warning, irreversible, or never. "irreversible" is critical plus a gate on migrations that destroy data with no down file.'
    default: 'critical'
  exclude:
    description: 'Comma-separated list of rules to skip (e.g. MP001,MP004)'
    required: false
  config-file:
    description: 'Path to .migrationpilotrc.yml config file (auto-detected if not specified)'
    required: false

outputs:
  risk-level:
    description: 'Overall risk level: RED, YELLOW, or GREEN'
  violations:
    description: 'Number of violations found'
  sarif-file:
    description: 'Path to SARIF results file for GitHub Code Scanning'

runs:
  # GitHub never shipped a node22 runtime for actions — it went straight from
  # node20 to node24 — so this was a value the runner rejects outright. node20
  # is being removed from the runners in late 2026; node24 is the one to be on.
  using: 'node24'
  main: 'dist/action/index.js'
